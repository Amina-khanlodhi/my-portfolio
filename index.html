<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amina Lodhi — Frontend Developer</title>
<meta name="description" content="Portfolio of Amina Lodhi, an aspiring frontend developer in Karachi building responsive, detail-obsessed web interfaces.">

<!-- Fonts: Fraunces (display) · Manrope (body) · Space Mono (meta/code) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Bootstrap (used sparingly for grid utilities) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Custom design system -->
<link rel="stylesheet" href="css/style.css">

<!-- Set theme before paint to avoid a flash of the wrong theme -->
<script>
  (function(){
    var stored = localStorage.getItem('al-theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    if (stored) document.documentElement.setAttribute('data-theme', stored);
    else if (prefersLight) document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor-dot" id="cursor-dot"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<!-- Ambient background -->
<div class="blob-field" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
</div>

<!-- Preloader -->
<div id="preloader" aria-hidden="true">
  <div class="preload-mark">
    <svg class="preload-ring" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="preload-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF6B4A"></stop>
          <stop offset="100%" stop-color="#B9A6E8"></stop>
        </linearGradient>
      </defs>
      <circle class="preload-ring-track" cx="60" cy="60" r="52"></circle>
      <circle class="preload-ring-bar" id="preloader-ring-bar" cx="60" cy="60" r="52"></circle>
    </svg>
    <div class="preload-center">
      <span class="preload-logo">A<em>.</em></span>
      <span class="preload-pct" id="preloader-pct">00</span>
    </div>
  </div>
  <p class="preload-label">Loading portfolio</p>
</div>

<!-- ============ SECTION MOUNT POINTS ============
     Each section lives in its own file under /sections and injects its
     markup into the matching <div> below. Open a section's .js file to
     edit its copy — no build step, just plain text in a template string. -->
<div id="nav-mount"></div>

<main>
  <div id="hero-mount"></div>
  <div id="about-mount"></div>
  <div id="skills-mount"></div>
  <div id="services-mount"></div>
  <div id="projects-mount"></div>
  <div id="experience-mount"></div>
  <div id="testimonials-mount"></div>
  <div id="contact-mount"></div>
</main>

<div id="footer-mount"></div>

<!-- ============ THIRD-PARTY LIBRARIES ============ -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- ============ SECTIONS (each writes into its mount point above) ============ -->
<script src="sections/nav.js"></script>
<script src="sections/hero.js"></script>
<script src="sections/about.js"></script>
<script src="sections/skills.js"></script>
<script src="sections/services.js"></script>
<script src="sections/projects.js"></script>
<script src="sections/experience.js"></script>
<script src="sections/testimonials.js"></script>
<script src="sections/contact.js"></script>
<script src="sections/footer.js"></script>

<!-- ============ BEHAVIOR (runs after all sections are in the DOM) ============ -->
<script src="js/main.js"></script>
</body>
</html>
